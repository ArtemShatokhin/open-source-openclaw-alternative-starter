# Example Kortix project manifest — open source project template.
# This file declares the machine image, the connectors and the triggers.
# Docs: https://kortix.com/docs
#
# It is a starting point you edit; nothing here is required to be correct
# out of the box, and the whole file is yours to version and review.

name: open-source-openclaw-alternative-starter

agents:
  assistant:
    file: agents/assistant.md
    connectors: all

skills:
  summarize-inbox:
    file: skills/summarize-inbox.md

triggers:
  - slug: weekday-digest
    type: cron
    cron: "0 9 * * 1-5"
    prompt: Summarize yesterday's work and open a change request with the digest.
